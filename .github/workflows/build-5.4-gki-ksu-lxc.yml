name: build-5.4-gki-ksu-lxc

on:
  workflow_dispatch:

env:
  KERNEL_SOURCE: https://github.com/3032252626/kernel_xiaomi_raphael-5.4
  KERNEL_BRANCH: zundamon-miui-5.4
  KERNEL_CONFIG: raphael_defconfig
  KERNEL_ZIP_NAME: raphael-5.4-ksu-lxc

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{env.KERNEL_SOURCE}}
          ref: ${{env.KERNEL_BRANCH}}
          path: kernel

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc flex bison libssl-dev libelf-dev

      - name: Download AOSP clang
        run: |
          mkdir -p kernel_workspace/clang
          wget -q https://github.com/LineageOS/android_prebuilts_clang_host_linux-x86_clang-r450784d/archive/refs/heads/main.tar.gz -O /tmp/clang.tar.gz
          tar xf /tmp/clang.tar.gz --strip-components=1 -C kernel_workspace/clang
          kernel_workspace/clang/bin/clang --version | head -1

      - name: Apply KernelSU v0.9.5
        run: |
          cd kernel
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s v0.9.5

      - name: Enable LXC/Docker options
        run: |
          cd kernel
          cat >> arch/arm64/configs/${{env.KERNEL_CONFIG}} << 'EOF'
CONFIG_PID_NS=y
CONFIG_NET_NS=y
CONFIG_CGROUP_PIDS=y
CONFIG_CGROUP_DEVICE=y
CONFIG_CHECKPOINT_RESTORE=y
CONFIG_POSIX_MQUEUE=y
CONFIG_USER_NS=y
EOF

      - name: Build kernel
        run: |
          cd kernel
          export PATH=$GITHUB_WORKSPACE/kernel_workspace/clang/bin:$PATH
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          make O=out ARCH=arm64 ${{env.KERNEL_CONFIG}}
          make O=out ARCH=arm64 olddefconfig
          make O=out ARCH=arm64 -j$(nproc) CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- Image.gz

      - name: Package AnyKernel3
        run: |
          mkdir -p kernel_workspace
          cd kernel_workspace
          git clone https://github.com/osm0sis/AnyKernel3
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' AnyKernel3/anykernel.sh
          sed -i 's!BLOCK=/dev/block/platform/omap/omap_hsmmc.0/by-name/boot;!BLOCK=/dev/block/bootdevice/by-name/boot;!g' AnyKernel3/anykernel.sh
          sed -i 's/is_slot_device=1;/is_slot_device=0;/g' AnyKernel3/anykernel.sh
          cp $GITHUB_WORKSPACE/kernel/out/arch/arm64/boot/Image.gz AnyKernel3/
          cd AnyKernel3
          zip -r9 ../${{env.KERNEL_ZIP_NAME}}.zip . -x .git*

      - uses: actions/upload-artifact@v4
        with:
          name: ${{env.KERNEL_ZIP_NAME}}
          path: kernel_workspace/${{env.KERNEL_ZIP_NAME}}.zip
