name: build-5.4-zyc-clang18

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: 读取配置文件
        run: |
          cat config.env | grep KERNEL_SOURCE= >> $GITHUB_ENV
          cat config.env | grep KERNEL_SOURCE_BRANCH= >> $GITHUB_ENV
          cat config.env | grep KERNEL_CONFIG= >> $GITHUB_ENV
          cat config.env | grep KERNEL_ZIP_NAME= >> $GITHUB_ENV
          cat config.env | grep LLVM_CONFIG= >> $GITHUB_ENV
          cat config.env | grep KERNEL_IMAGE_NAME= >> $GITHUB_ENV
          cat config.env | grep NEED_DTBO= >> $GITHUB_ENV
          cat config.env | grep SWITCH_PYTHON= >> $GITHUB_ENV
          cat config.env | grep ENABLE_KVM= >> $GITHUB_ENV
          cat config.env | grep ENABLE_LXC_DOCKER= >> $GITHUB_ENV
          cat config.env | grep ENABLE_KERNELSU= >> $GITHUB_ENV
          cat config.env | grep KERNELSU_TAG= >> $GITHUB_ENV

      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo -E apt-get -y -qq install git make bc bison ccache openssl zip kmod cpio flex libelf-dev curl libssl-dev libtfm-dev wget device-tree-compiler ca-certificates python3 binutils binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi
          mkdir -p $GITHUB_WORKSPACE/kernel_workspace

      - name: 下载zyc编译器
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace
          mkdir clang-zyc
          wget https://github.com/ZyCromerZ/Clang/releases/download/18.0.0-20230903-release/Clang-18.0.0-20230903.tar.gz
          tar -C clang-zyc/ -zxf Clang-18.0.0-20230903.tar.gz

      - name: 下载内核源码
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace
          git clone ${{ env.KERNEL_SOURCE }} -b ${{ env.KERNEL_SOURCE_BRANCH }} android-kernel --depth=1

      - name: 开启LXC/Docker配置
        if: env.ENABLE_LXC_DOCKER == 'true'
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace
          wget https://raw.githubusercontent.com/3032252626/android-lxc-docker/main/LXC-DOCKER-OPEN-CONFIG.sh
          chmod 755 LXC-DOCKER-OPEN-CONFIG.sh
          sed -i '/^CONFIG_PID_NS=/d' android-kernel/arch/arm64/configs/${{ env.KERNEL_CONFIG }}
          sed -i '/^CONFIG_BRIDGE_NETFILTER=/d' android-kernel/arch/arm64/configs/${{ env.KERNEL_CONFIG }}
          echo "CONFIG_PID_NS=y" >> android-kernel/arch/arm64/configs/${{ env.KERNEL_CONFIG }}
          echo "CONFIG_BRIDGE_NETFILTER=y" >> android-kernel/arch/arm64/configs/${{ env.KERNEL_CONFIG }}
          ./LXC-DOCKER-OPEN-CONFIG.sh android-kernel/arch/arm64/configs/${{ env.KERNEL_CONFIG }} -w
          echo "# CONFIG_ANDROID_PARANOID_NETWORK is not set" >> android-kernel/arch/arm64/configs/${{ env.KERNEL_CONFIG }}
          echo "CONFIG_IP6_NF_IPTABLES=y" >> android-kernel/arch/arm64/configs/${{ env.KERNEL_CONFIG }}
          echo "CONFIG_IP6_NF_FILTER=y" >> android-kernel/arch/arm64/configs/${{ env.KERNEL_CONFIG }}
          echo "CONFIG_NF_TABLES_IPV4=y" >> android-kernel/arch/arm64/configs/${{ env.KERNEL_CONFIG }}
          echo "CONFIG_NF_TABLES_IPV6=y" >> android-kernel/arch/arm64/configs/${{ env.KERNEL_CONFIG }}

      - name: 应用xt_qtaguid补丁
        if: env.ENABLE_LXC_DOCKER == 'true'
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace
          wget https://raw.githubusercontent.com/3032252626/android-lxc-docker/main/xt_qtaguid.patch
          patch -p1 -d android-kernel < xt_qtaguid.patch || echo "xt_qtaguid.patch not applicable"

      - name: Droidspaces配置补充
        if: env.ENABLE_LXC_DOCKER == 'true'
        run: |
          CONFIG_FILE="$GITHUB_WORKSPACE/kernel_workspace/android-kernel/arch/arm64/configs/${{ env.KERNEL_CONFIG }}"
          check_add() {
            local key="$1" val="$2"
            if grep -q "^${key}=" "$CONFIG_FILE"; then
              echo "[SKIP] $key"
            else
              echo "$key=$val" >> "$CONFIG_FILE"
              echo "[ADD]  $key=$val"
            fi
          }
          check_add CONFIG_SYSCTL y
          check_add CONFIG_SYSVIPC y
          check_add CONFIG_POSIX_MQUEUE y
          check_add CONFIG_NAMESPACES y
          check_add CONFIG_UTS_NS y
          check_add CONFIG_IPC_NS y
          check_add CONFIG_SECCOMP y
          check_add CONFIG_SECCOMP_FILTER y
          check_add CONFIG_CGROUPS y
          check_add CONFIG_CGROUP_DEVICE y
          check_add CONFIG_CGROUP_PIDS y
          check_add CONFIG_MEMCG y
          check_add CONFIG_CGROUP_SCHED y
          check_add CONFIG_FAIR_GROUP_SCHED y
          check_add CONFIG_CGROUP_FREEZER y
          check_add CONFIG_CGROUP_NET_PRIO y
          check_add CONFIG_DEVTMPFS y
          check_add CONFIG_OVERLAY_FS y
          check_add CONFIG_TMPFS_POSIX_ACL y
          check_add CONFIG_TMPFS_XATTR y
          check_add CONFIG_FW_LOADER y
          check_add CONFIG_FW_LOADER_USER_HELPER y
          check_add CONFIG_FW_LOADER_COMPRESS y
          check_add CONFIG_NET_NS y
          check_add CONFIG_VETH y
          check_add CONFIG_BRIDGE y
          check_add CONFIG_NETFILTER y
          check_add CONFIG_BRIDGE_NETFILTER y
          check_add CONFIG_NETFILTER_ADVANCED y
          check_add CONFIG_NF_CONNTRACK y
          check_add CONFIG_IP_NF_IPTABLES y
          check_add CONFIG_IP_NF_FILTER y
          check_add CONFIG_NF_NAT y
          check_add CONFIG_NF_TABLES y
          check_add CONFIG_IP_NF_TARGET_MASQUERADE y
          check_add CONFIG_NETFILTER_XT_TARGET_MASQUERADE y
          check_add CONFIG_NETFILTER_XT_TARGET_TCPMSS y
          check_add CONFIG_NETFILTER_XT_MATCH_ADDRTYPE y
          check_add CONFIG_NF_CONNTRACK_NETLINK y
          check_add CONFIG_NF_NAT_REDIRECT y
          check_add CONFIG_IP_ADVANCED_ROUTER y
          check_add CONFIG_IP_MULTIPLE_TABLES y
          check_add CONFIG_NF_CONNTRACK_IPV4 y
          check_add CONFIG_NF_NAT_IPV4 y
          check_add CONFIG_IP_NF_NAT y
          check_add CONFIG_DEVPTS_MULTIPLE_INSTANCES y
          check_add CONFIG_MEMCG_KMEM y
          check_add CONFIG_BINFMT_MISC y
          check_add CONFIG_NETFILTER_XT_MATCH_CGROUP y
          check_add CONFIG_RESOURCE_COUNTERS y

      - name: Droidspaces内核补丁
        if: env.ENABLE_LXC_DOCKER == 'true'
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
          echo "[1/2] xt_qtaguid panic fix"
          curl -LSs https://raw.githubusercontent.com/ravindu644/Droidspaces-OSS/main/Documentation/resources/kernel-patches/non-GKI/01.fix_kernel_panic_in_xt_qtaguid.patch | patch -p1 || echo "[WARN] patch 01 skipped"
          echo "[2/2] cgroup prefix fix"
          curl -LSs "https://raw.githubusercontent.com/ravindu644/Droidspaces-OSS/main/Documentation/resources/kernel-patches/non-GKI/02.fix_restore%20cgroup%20file%20prefix%20handling%20.patch" | patch -p1 || echo "[WARN] patch 02 skipped"

      - name: 应用runc补丁
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace
          wget https://github.com/fate-think/LXC-DOCKER-KernelSU_Action/releases/download/1.0.0/runcpatch.sh
          chmod a+x runcpatch.sh
          if [ -f android-kernel/kernel/cgroup.c ]; then ./runcpatch.sh android-kernel/kernel/cgroup.c; fi
          if [ -f android-kernel/kernel/cgroup/cgroup.c ]; then ./runcpatch.sh android-kernel/kernel/cgroup/cgroup.c; fi

      - name: 修复clang编译
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
          sed -i "s/CONFIG_CC_STACKPROTECTOR_STRONG=y/# CONFIG_CC_STACKPROTECTOR_STRONG is not set/g" arch/arm64/configs/${{ env.KERNEL_CONFIG }}
          wget https://github.com/fate-think/LXC-DOCKER-KernelSU_Action/releases/download/v3.0.0-stable/clangfix3.sh
          chmod u+x clangfix3.sh
          ./clangfix3.sh || true

      - name: 配置KernelSU
        if: env.ENABLE_KERNELSU == 'true'
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s ${{ env.KERNELSU_TAG }}

      - name: 设置编译缓存
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: build-5.4-zyc
          max-size: 2G

      - name: 开始编译内核
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
          export PATH=$GITHUB_WORKSPACE/kernel_workspace/clang-zyc/bin:$PATH
          export KBUILD_BUILD_HOST=17
          export KBUILD_BUILD_USER=HyperPower
          make -s -j$(nproc --all) O=out ARCH=arm64 ${{ env.KERNEL_CONFIG }}
          if [ ${{env.LLVM_CONFIG}}=y ]; then
          make -j$(nproc --all) CONFIG_DEBUG_SECTION_MISMATCH=y CC="ccache clang" CXX=clang++ O=out ARCH=arm64 CLANG_TRIPLE="aarch64-linux-gnu-" CROSS_COMPILE="aarch64-linux-gnu-" CROSS_COMPILE_ARM32="arm-linux-gnueabi-" LLVM=1 LLVM_IAS=1
          else
          make -j$(nproc --all) CONFIG_DEBUG_SECTION_MISMATCH=y CC="ccache clang" CXX=clang++ O=out ARCH=arm64 CLANG_TRIPLE="aarch64-linux-gnu-" CROSS_COMPILE="aarch64-linux-gnu-" CROSS_COMPILE_ARM32="arm-linux-gnueabi-"
          fi

      - name: 打包AnyKernel3
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace
          git clone https://github.com/osm0sis/AnyKernel3
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' AnyKernel3/anykernel.sh
          sed -i 's!block=/dev/block/platform/omap/omap_hsmmc.0/by-name/boot;!block=auto;!g' AnyKernel3/anykernel.sh
          sed -i 's/is_slot_device=1;/is_slot_device=auto;/g' AnyKernel3/anykernel.sh
          cp android-kernel/out/arch/arm64/boot/${{ env.KERNEL_IMAGE_NAME }} AnyKernel3/
          rm -rf AnyKernel3/.git* AnyKernel3/README.md
          rm -rf AnyKernel3/ramdisk AnyKernel3/modules AnyKernel3/patch

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.KERNEL_ZIP_NAME }}
          path: kernel_workspace/AnyKernel3/*
