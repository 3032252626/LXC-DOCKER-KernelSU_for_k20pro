name: Droidspaces Non-GKI 谷歌clang14
on:
  workflow_dispatch:

jobs:
  build:
    name: 
    runs-on: ubuntu-latest
    if: github.event.repository.owner.id == github.event.sender.id
    
    steps:
    - uses: actions/checkout@v3
    
    - name: 环境变量配置
      run: |
        cat config.env | grep KERNEL_SOURCE= >> $GITHUB_ENV
        cat config.env | grep KERNEL_SOURCE_BRANCH= >> $GITHUB_ENV
        cat config.env | grep KERNEL_CONFIG= >> $GITHUB_ENV
        cat config.env | grep KERNEL_ZIP_NAME= >> $GITHUB_ENV
        cat config.env | grep LLVM_CONFIG= >> $GITHUB_ENV
        cat config.env | grep KERNEL_IMAGE_NAME= >> $GITHUB_ENV
        cat config.env | grep NEED_DTBO= >> $GITHUB_ENV
        cat config.env | grep SWITCH_PYTHON= >> $GITHUB_ENV
        cat config.env | grep ENABLE_KVM= >> $GITHUB_ENV
        cat config.env | grep ENABLE_LXC_DOCKER= >> $GITHUB_ENV
        cat config.env | grep ENABLE_KERNELSU= >> $GITHUB_ENV
        cat config.env | grep KERNELSU_TAG= >> $GITHUB_ENV

    - name: 构建编译内核环境
      run: |
        sudo apt-get update
        sudo -E apt-get -y -qq install git make bc bison ccache openssl zip kmod cpio flex libelf-dev curl libssl-dev libtfm-dev wget device-tree-compiler ca-certificates python3 python2 binutils binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi
        mkdir -p $GITHUB_WORKSPACE/kernel_workspace

    - name: 切换python2.7
      if: env.SWITCH_PYTHON == 'true'
      run: |
       sudo rm -f /usr/bin/python
       sudo ln -s /usr/bin/python2.7 /usr/bin/python
          
    - name: 下载Clang-aosp编译器
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        mkdir clang-aosp
        git clone -q --depth=1 --single-branch https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 -b android13-release clang-aosp
                          
    - name: 下载内核源码
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        git clone ${{ env.KERNEL_SOURCE }} -b ${{ env.KERNEL_SOURCE_BRANCH }} android-kernel --depth=1
                      
    - name: 开启lxc和docker配置
      if: env.ENABLE_LXC_DOCKER == 'true'
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        wget https://github.com/fate-think/LXC-DOCKER-KernelSU_Action/releases/download/1.0.0/add-lxc-docker-custom.sh
        chmod 755 add-lxc-docker-custom.sh
        ./add-lxc-docker-custom.sh android-kernel/arch/arm64/configs/${{ env.KERNEL_CONFIG }}
        echo "# CONFIG_ANDROID_PARANOID_NETWORK is not set" >> android-kernel/arch/arm64/configs/${{ env.KERNEL_CONFIG }}

    - name: 添加runc补丁
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        wget https://github.com/fate-think/LXC-DOCKER-KernelSU_Action/releases/download/1.0.0/runcpatch.sh
        chmod a+x runcpatch.sh
        if [ -f android-kernel/kernel/cgroup.c ]; then
        ./runcpatch.sh android-kernel/kernel/cgroup.c               
        fi
        if [ -f android-kernel/kernel/cgroup/cgroup.c ]; then
        ./runcpatch.sh android-kernel/kernel/cgroup/cgroup.c               
        fi

    - name: Droidspaces Non-GKI 内核配置补充
      if: env.ENABLE_LXC_DOCKER == 'true'
      run: |
        CONFIG_FILE="$GITHUB_WORKSPACE/kernel_workspace/android-kernel/arch/arm64/configs/${{ env.KERNEL_CONFIG }}"
        echo "=== Droidspaces Non-GKI 配置补充 ==="
        echo "目标 defconfig: $CONFIG_FILE"
        echo ""
        
        # 逐项检查，仅补充缺失项，已存在的跳过
        added=0; skipped=0
        
        check_add() {
          local key="$1" val="$2"
          if grep -q "^${key}=" "$CONFIG_FILE"; then
            echo "[SKIP] $key 已存在"
            skipped=$((skipped+1))
          else
            echo "$key=$val" >> "$CONFIG_FILE"
            echo "[ADD]  $key=$val"
            added=$((added+1))
          fi
        }
        
        check_add CONFIG_SYSCTL y
        check_add CONFIG_SYSVIPC y
        check_add CONFIG_POSIX_MQUEUE y
        check_add CONFIG_NAMESPACES y
        check_add CONFIG_PID_NS y
        check_add CONFIG_UTS_NS y
        check_add CONFIG_IPC_NS y
        check_add CONFIG_SECCOMP y
        check_add CONFIG_SECCOMP_FILTER y
        check_add CONFIG_CGROUPS y
        check_add CONFIG_CGROUP_DEVICE y
        check_add CONFIG_CGROUP_PIDS y
        check_add CONFIG_MEMCG y
        check_add CONFIG_CGROUP_SCHED y
        check_add CONFIG_FAIR_GROUP_SCHED y
        check_add CONFIG_CGROUP_FREEZER y
        check_add CONFIG_CGROUP_NET_PRIO y
        check_add CONFIG_DEVTMPFS y
        check_add CONFIG_OVERLAY_FS y
        check_add CONFIG_TMPFS_POSIX_ACL y
        check_add CONFIG_TMPFS_XATTR y
        check_add CONFIG_FW_LOADER y
        check_add CONFIG_FW_LOADER_USER_HELPER y
        check_add CONFIG_FW_LOADER_COMPRESS y
        check_add CONFIG_NET_NS y
        check_add CONFIG_VETH y
        check_add CONFIG_BRIDGE y
        check_add CONFIG_NETFILTER y
        check_add CONFIG_BRIDGE_NETFILTER y
        check_add CONFIG_NETFILTER_ADVANCED y
        check_add CONFIG_NF_CONNTRACK y
        check_add CONFIG_IP_NF_IPTABLES y
        check_add CONFIG_IP_NF_FILTER y
        check_add CONFIG_NF_NAT y
        check_add CONFIG_NF_TABLES y
        check_add CONFIG_IP_NF_TARGET_MASQUERADE y
        check_add CONFIG_NETFILTER_XT_TARGET_MASQUERADE y
        check_add CONFIG_NETFILTER_XT_TARGET_TCPMSS y
        check_add CONFIG_NETFILTER_XT_MATCH_ADDRTYPE y
        check_add CONFIG_NF_CONNTRACK_NETLINK y
        check_add CONFIG_NF_NAT_REDIRECT y
        check_add CONFIG_IP_ADVANCED_ROUTER y
        check_add CONFIG_IP_MULTIPLE_TABLES y
        check_add CONFIG_NF_CONNTRACK_IPV4 y
        check_add CONFIG_NF_NAT_IPV4 y
        check_add CONFIG_IP_NF_NAT y
        
        echo ""
        echo "=== 配置补充完成：新增 $added 项，跳过 $skipped 项 ==="

    - name: Droidspaces Non-GKI 补丁应用
      if: env.ENABLE_LXC_DOCKER == 'true'
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
        
        echo "=== 应用 Droidspaces Non-GKI 补丁 ==="
        
        echo "[1/2] 修复 xt_qtaguid 内核 panic"
        curl -LSs https://raw.githubusercontent.com/ravindu644/Droidspaces-OSS/main/Documentation/resources/kernel-patches/non-GKI/01.fix_kernel_panic_in_xt_qtaguid.patch | patch -p1 || echo "[WARN] 补丁 01 应用失败（可能已存在或冲突）"
        
        echo "[2/2] 修复 cgroup 文件前缀处理"
        curl -LSs https://raw.githubusercontent.com/ravindu644/Droidspaces-OSS/main/Documentation/resources/kernel-patches/non-GKI/02.fix_restore%20cgroup%20file%20prefix%20handling%20.patch | patch -p1 || echo "[WARN] 补丁 02 应用失败（可能已存在或冲突）"
        
        echo "=== 补丁应用完毕 ==="
  
    - name: 配置 ksu
      if: env.ENABLE_KERNELSU == 'true'
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
        curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s ${{ env.KERNELSU_TAG }}

    - name: 开启kvm
      if: env.ENABLE_KVM == 'true'
      run: |
         cd $GITHUB_WORKSPACE/kernel_workspace
         echo "CONFIG_VIRTUALIZATION=y" >> android-kernel/arch/arm64/configs/${{ env.KERNEL_CONFIG }}
         echo "CONFIG_KVM=y" >> android-kernel/arch/arm64/configs/${{ env.KERNEL_CONFIG }}
         echo "CONFIG_VHOST_NET=y" >> android-kernel/arch/arm64/configs/${{ env.KERNEL_CONFIG }}
         echo "CONFIG_VHOST_CROSS_ENDIAN_LEGACY=y" >> android-kernel/arch/arm64/configs/${{ env.KERNEL_CONFIG }}
                     
    - name: 设置ccache缓存
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: build-kernel-mido-kernel-droidspaces
        max-size: 2G

    - name: 开始编译内核
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
        export PATH=$GITHUB_WORKSPACE/kernel_workspace/clang-aosp/clang-r450784d/bin:$PATH
        make O=out ARCH=arm64 ${{ env.KERNEL_CONFIG }}
        if [ ${{env.LLVM_CONFIG}}=y ]; then
        make -j$(nproc --all) CC="ccache clang" CXX=clang++ O=out ARCH=arm64 SUBARCH=arm64 CROSS_COMPILE="aarch64-linux-gnu-" CROSS_COMPILE_ARM32="arm-linux-gnueabi-" LLVM=1 LLVM_IAS=1
        else
        make -j$(nproc --all) CC="ccache clang" CXX=clang++ O=out ARCH=arm64 SUBARCH=arm64 CROSS_COMPILE="aarch64-linux-gnu-" CROSS_COMPILE_ARM32="arm-linux-gnueabi-"
        fi
                
    - name: 准备打包内核
      run: |       
        cd $GITHUB_WORKSPACE/kernel_workspace
        git clone https://github.com/osm0sis/AnyKernel3
        sed -i 's/do.devicecheck=1/do.devicecheck=0/g' AnyKernel3/anykernel.sh
        sed -i 's!block=/dev/block/platform/omap/omap_hsmmc.0/by-name/boot;!block=auto;!g' AnyKernel3/anykernel.sh
        sed -i 's/is_slot_device=1;/is_slot_device=auto;/g' AnyKernel3/anykernel.sh        
        cp android-kernel/out/arch/arm64/boot/${{ env.KERNEL_IMAGE_NAME }} AnyKernel3/
        if [ ${{ env.NEED_DTBO }} = true ]; then
            echo "NEED=true" >> $GITHUB_ENV
            if [ -f android-kernel/out/arch/arm64/boot/dtbo.img ]; then
                echo "DTBO_EXIST=true" >> $GITHUB_ENV           
            fi
        fi        
        if [ ${{ env.DTBO_EXIST }} = true ]; then
            cp android-kernel/out/arch/arm64/boot/dtbo.img AnyKernel3/
        fi  
        rm -rf AnyKernel3/.git* AnyKernel3/README.md
        rm -rf AnyKernel3/ramdisk AnyKernel3/modules AnyKernel3/patch
       
    - name: 上传内核
      uses: actions/upload-artifact@v3
      with:
        name: ${{ env.KERNEL_ZIP_NAME }}
        path: kernel_workspace/AnyKernel3/*

    - name: 上传dtbo镜像
      if: env.DTBO_EXIST == 'true' && env.NEED == 'true'
      uses: actions/upload-artifact@v3
      with:
        name: dtbo-image
        path: kernel_workspace/android-kernel/out/arch/arm64/boot/dtbo.img
