name: Droidspaces Non-GKI 谷歌clang14 [方案1-kprobe]

on:

  workflow_dispatch:

jobs:

  build:

    name: 

    runs-on: ubuntu-latest

    if: github.event.repository.owner.id == github.event.sender.id

    

    steps:

    - uses: actions/checkout@v4

    

    - name: 环境变量配置

      run: |

        cat config-4.14.env | grep KERNEL_SOURCE= >> $GITHUB_ENV

        cat config-4.14.env | grep KERNEL_SOURCE_BRANCH= >> $GITHUB_ENV

        cat config-4.14.env | grep KERNEL_CONFIG= >> $GITHUB_ENV

        cat config-4.14.env | grep KERNEL_ZIP_NAME= >> $GITHUB_ENV

        cat config-4.14.env | grep LLVM_CONFIG= >> $GITHUB_ENV

        cat config-4.14.env | grep ENABLE_KERNELSU= >> $GITHUB_ENV

        cat config-4.14.env | grep KERNELSU_TAG= >> $GITHUB_ENV

        cat config-4.14.env | grep ENABLE_KVM= >> $GITHUB_ENV

        cat config-4.14.env | grep ENABLE_PATH_UMOUNT= >> $GITHUB_ENV

        cat config-4.14.env | grep ENABLE_LXC_DOCKER= >> $GITHUB_ENV

        cat config-4.14.env | grep KERNEL_IMAGE_NAME= >> $GITHUB_ENV

        cat config-4.14.env | grep NEED_DTBO= >> $GITHUB_ENV

        cat config-4.14.env | grep ENABLE_KERNELSU= >> $GITHUB_ENV

        cat config-4.14.env | grep KERNELSU_TAG= >> $GITHUB_ENV

    - name: 构建编译内核环境

      run: |

        sudo apt-get update

        sudo -E apt-get -y -qq install git make bc bison ccache openssl zip kmod cpio flex libelf-dev curl libssl-dev libtfm-dev wget device-tree-compiler libyaml-dev ca-certificates python3 binutils binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi

        mkdir -p $GITHUB_WORKSPACE/kernel_workspace

    

    - name: 下载Clang-aosp编译器

      run: |

        cd $GITHUB_WORKSPACE/kernel_workspace

        mkdir clang-aosp

        git clone -q --depth=1 --single-branch https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 -b android13-release clang-aosp

    

    

    - name: 下载内核源码

      run: |

        cd $GITHUB_WORKSPACE/kernel_workspace

        git clone ${{ env.KERNEL_SOURCE }} -b ${{ env.KERNEL_SOURCE_BRANCH }} android-kernel --depth=1

                  

    

    - name: 开启lxc和docker配置

      if: env.ENABLE_LXC_DOCKER == 'true'

      run: |

        cd $GITHUB_WORKSPACE/kernel_workspace

        wget https://raw.githubusercontent.com/3032252626/android-lxc-docker/main/LXC-DOCKER-OPEN-CONFIG.sh

        chmod 755 LXC-DOCKER-OPEN-CONFIG.sh

        # 清理重复配置项（避免脚本报 appears more than once）
        sed -i '/^CONFIG_PID_NS=/d' android-kernel/arch/arm64/configs/${{ env.KERNEL_CONFIG }}
        sed -i '/^CONFIG_BRIDGE_NETFILTER=/d' android-kernel/arch/arm64/configs/${{ env.KERNEL_CONFIG }}
        echo "CONFIG_PID_NS=y" >> android-kernel/arch/arm64/configs/${{ env.KERNEL_CONFIG }}
        echo "CONFIG_BRIDGE_NETFILTER=y" >> android-kernel/arch/arm64/configs/${{ env.KERNEL_CONFIG }}
        ./LXC-DOCKER-OPEN-CONFIG.sh android-kernel/arch/arm64/configs/${{ env.KERNEL_CONFIG }} -w

        echo "# CONFIG_ANDROID_PARANOID_NETWORK is not set" >> android-kernel/arch/arm64/configs/${{ env.KERNEL_CONFIG }}
        echo "CONFIG_IP6_NF_IPTABLES=y" >> android-kernel/arch/arm64/configs/${{ env.KERNEL_CONFIG }}
        echo "CONFIG_IP6_NF_FILTER=y" >> android-kernel/arch/arm64/configs/${{ env.KERNEL_CONFIG }}
        echo "CONFIG_NF_TABLES_IPV4=y" >> android-kernel/arch/arm64/configs/${{ env.KERNEL_CONFIG }}
        echo "CONFIG_NF_TABLES_IPV6=y" >> android-kernel/arch/arm64/configs/${{ env.KERNEL_CONFIG }}

    - name: 添加补丁

      run: |

        cd $GITHUB_WORKSPACE/kernel_workspace

        wget https://raw.githubusercontent.com/3032252626/android-lxc-docker/main/xt_qtaguid.patch

        patch -p1 -d android-kernel < xt_qtaguid.patch || echo "xt_qtaguid.patch not applicable"

    - name: Droidspaces Non-GKI 内核配置补充

      if: env.ENABLE_LXC_DOCKER == 'true'

      run: |

        CONFIG_FILE="$GITHUB_WORKSPACE/kernel_workspace/android-kernel/arch/arm64/configs/${{ env.KERNEL_CONFIG }}"
        echo "=== Droidspaces Non-GKI 配置补充 ==="

        added=0; skipped=0

        check_add() {
          local key="$1" val="$2"
          if grep -q "^${key}=" "$CONFIG_FILE"; then
            echo "[SKIP] $key 已存在"
            skipped=$((skipped+1))
          else
            echo "$key=$val" >> "$CONFIG_FILE"
            echo "[ADD]  $key=$val"
            added=$((added+1))
          fi
        }

        check_add CONFIG_SYSCTL y
        check_add CONFIG_SYSVIPC y
        check_add CONFIG_POSIX_MQUEUE y
        check_add CONFIG_NAMESPACES y
        check_add CONFIG_PID_NS y
        check_add CONFIG_UTS_NS y
        check_add CONFIG_IPC_NS y
        check_add CONFIG_SECCOMP y
        check_add CONFIG_SECCOMP_FILTER y
        check_add CONFIG_CGROUPS y
        check_add CONFIG_CGROUP_DEVICE y
        check_add CONFIG_CGROUP_PIDS y
        check_add CONFIG_MEMCG y
        check_add CONFIG_CGROUP_SCHED y
        check_add CONFIG_FAIR_GROUP_SCHED y
        check_add CONFIG_CGROUP_FREEZER y
        check_add CONFIG_CGROUP_NET_PRIO y
        check_add CONFIG_DEVTMPFS y
        check_add CONFIG_OVERLAY_FS y
        check_add CONFIG_TMPFS_POSIX_ACL y
        check_add CONFIG_TMPFS_XATTR y
        check_add CONFIG_FW_LOADER y
        check_add CONFIG_FW_LOADER_USER_HELPER y
        check_add CONFIG_FW_LOADER_COMPRESS y
        check_add CONFIG_NET_NS y
        check_add CONFIG_VETH y
        check_add CONFIG_BRIDGE y
        check_add CONFIG_NETFILTER y
        check_add CONFIG_BRIDGE_NETFILTER y
        check_add CONFIG_NETFILTER_ADVANCED y
        check_add CONFIG_NF_CONNTRACK y
        check_add CONFIG_IP_NF_IPTABLES y
        check_add CONFIG_IP_NF_FILTER y
        check_add CONFIG_NF_NAT y
        check_add CONFIG_NF_TABLES y
        check_add CONFIG_IP_NF_TARGET_MASQUERADE y
        check_add CONFIG_NETFILTER_XT_TARGET_MASQUERADE y
        check_add CONFIG_NETFILTER_XT_TARGET_TCPMSS y
        check_add CONFIG_NETFILTER_XT_MATCH_ADDRTYPE y
        check_add CONFIG_NF_CONNTRACK_NETLINK y
        check_add CONFIG_NF_NAT_REDIRECT y
        check_add CONFIG_IP_ADVANCED_ROUTER y
        check_add CONFIG_IP_MULTIPLE_TABLES y
        check_add CONFIG_NF_CONNTRACK_IPV4 y
        check_add CONFIG_NF_NAT_IPV4 y
        check_add CONFIG_IP_NF_NAT y

        echo ""
        echo "=== 配置补充完成：新增 $added 项，跳过 $skipped 项 ==="

    - name: Droidspaces Non-GKI 补丁应用

      if: env.ENABLE_LXC_DOCKER == 'true'

      run: |

        cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel

        echo "=== 应用 Droidspaces Non-GKI 补丁 ==="

        echo "[1/2] 修复 xt_qtaguid 内核 panic"
        curl -LSs https://raw.githubusercontent.com/ravindu644/Droidspaces-OSS/main/Documentation/resources/kernel-patches/non-GKI/01.fix_kernel_panic_in_xt_qtaguid.patch | patch -p1 || echo "[WARN] 补丁 01 应用失败（可能已存在或冲突）"

        echo "[2/2] 修复 cgroup 文件前缀处理"
        curl -LSs https://raw.githubusercontent.com/ravindu644/Droidspaces-OSS/main/Documentation/resources/kernel-patches/non-GKI/02.fix_restore%20cgroup%20file%20prefix%20handling%20.patch | patch -p1 || echo "[WARN] 补丁 02 应用失败（可能已存在或冲突）"

        echo "=== 补丁应用完毕 ==="

    - name: 配置 ksu（方案1：非GKI兼容fork）

      if: env.ENABLE_KERNELSU == 'true'

      run: |

        cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel

        # 使用自有fork（3032252626/KernelSU），源自rsuntk/KernelSU非GKI backport

        # 官方tiann/KernelSU自v1.0起放弃非GKI支持

        curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s v0.9.5

    - name: 开启kvm

      if: env.ENABLE_KVM == 'true'

      run: |

         cd $GITHUB_WORKSPACE/kernel_workspace

         echo "CONFIG_VIRTUALIZATION=y" >> android-kernel/arch/arm64/configs/${{ env.KERNEL_CONFIG }}

         echo "CONFIG_KVM=y" >> android-kernel/arch/arm64/configs/${{ env.KERNEL_CONFIG }}

         echo "CONFIG_VHOST_NET=y" >> android-kernel/arch/arm64/configs/${{ env.KERNEL_CONFIG }}

         echo "CONFIG_VHOST_CROSS_ENDIAN_LEGACY=y" >> android-kernel/arch/arm64/configs/${{ env.KERNEL_CONFIG }}

    - name: 配置KernelSU kprobe（方案1）
      if: env.ENABLE_KERNELSU == 'true'
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
        echo "CONFIG_MODULES=y" >> arch/arm64/configs/${{ env.KERNEL_CONFIG }}
        echo "CONFIG_KPROBES=y" >> arch/arm64/configs/${{ env.KERNEL_CONFIG }}
        echo "CONFIG_HAVE_KPROBES=y" >> arch/arm64/configs/${{ env.KERNEL_CONFIG }}
        echo "CONFIG_KPROBE_EVENTS=y" >> arch/arm64/configs/${{ env.KERNEL_CONFIG }}
        # 4.14 非GKI：KSU 由本工作流注入，必须显式打开内核开关
        grep -q '^CONFIG_KSU=y' arch/arm64/configs/${{ env.KERNEL_CONFIG }} || echo "CONFIG_KSU=y" >> arch/arm64/configs/${{ env.KERNEL_CONFIG }}
        grep -q '^CONFIG_KSU_KPROBES_HOOK=y' arch/arm64/configs/${{ env.KERNEL_CONFIG }} || echo "CONFIG_KSU_KPROBES_HOOK=y" >> arch/arm64/configs/${{ env.KERNEL_CONFIG }}
        if [ "${{ env.ENABLE_PATH_UMOUNT }}" = "true" ] && ! grep -q 'int path_umount' fs/namespace.c; then
          cd $GITHUB_WORKSPACE/kernel_workspace
          cat >> android-kernel/fs/namespace.c << 'PATHUMOUNTEOF'
        static int can_umount(const struct path *path, int flags)
        {
        	struct mount *mnt = real_mount(path->mnt);
        	if (flags & ~(MNT_FORCE | MNT_DETACH | MNT_EXPIRE | UMOUNT_NOFOLLOW))
        		return -EINVAL;
        	if (!may_mount())
        		return -EPERM;
        	if (path->dentry != path->mnt->mnt_root)
        		return -EINVAL;
        	if (!check_mnt(mnt))
        		return -EINVAL;
        	if (mnt->mnt.mnt_flags & MNT_LOCKED)
        		return -EINVAL;
        	if (flags & MNT_FORCE && !capable(CAP_SYS_ADMIN))
        		return -EPERM;
        	return 0;
        }

        int path_umount(struct path *path, int flags)
        {
        	struct mount *mnt = real_mount(path->mnt);
        	int ret;
        	ret = can_umount(path, flags);
        	if (!ret)
        		ret = do_umount(mnt, flags);
        	dput(path->dentry);
        	mntput_no_expire(mnt);
        	return ret;
        }
        PATHUMOUNTEOF
        fi
    - name: 设置ccache缓存

      uses: hendrikmuhs/ccache-action@v1.2

      with:

        key: build-kernel-mido-kernel-droidspaces

        max-size: 2G

    - name: 修复源码编译

      run: |

        cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel

        sed -i 's/HOSTLDLIBS_dtc/HOSTLOADLIBES_dtc/g' scripts/dtc/Makefile

        sed -i 's/ptep = huge_pmd_share/pte = huge_pmd_share/' arch/arm64/mm/hugetlbpage.c

        sed -i 's/struct timespec now = current_time/struct timespec64 now = current_time/' fs/btrfs/inode.c

        sed -i 's/struct timespec now = current_time/struct timespec64 now = current_time/' fs/btrfs/file.c

        

    - name: 开始编译内核

      run: |

        cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel

        export PATH=$GITHUB_WORKSPACE/kernel_workspace/clang-aosp/clang-r450784d/bin:$PATH

        export KBUILD_BUILD_HOST=17

        export KBUILD_BUILD_USER=HyperPower

        make -s -j$(nproc --all) O=out ARCH=arm64 ${{ env.KERNEL_CONFIG }}

        if [ ${{env.LLVM_CONFIG}}=y ]; then

        make -j$(nproc --all) CC="ccache clang" O=out ARCH=arm64 CLANG_TRIPLE="aarch64-linux-gnu-" CROSS_COMPILE="aarch64-linux-gnu-" CROSS_COMPILE_ARM32="arm-linux-gnueabi-" LLVM=1 LLVM_IAS=1

        else

        make -j$(nproc --all) CC="ccache clang" O=out ARCH=arm64 CLANG_TRIPLE="aarch64-linux-gnu-" CROSS_COMPILE="aarch64-linux-gnu-" CROSS_COMPILE_ARM32="arm-linux-gnueabi-"

        fi

                

    - name: 编译结果核查（4.14 基线）
      if: always()
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
        ls -l out/arch/arm64/boot/ 2>/dev/null || true
        if [ -f out/.config ]; then
          echo "===== 关键配置（4.14 开机基线）====="
          for k in CONFIG_ARCH_SM8150 CONFIG_MACH_XIAOMI_RAPHAEL CONFIG_BUILD_ARM64_DT_OVERLAY CONFIG_MODULES CONFIG_KPROBES CONFIG_KSU CONFIG_KSU_KPROBES_HOOK CONFIG_LTO_CLANG CONFIG_CFI_CLANG; do
            printf "%-38s %s\n" "$k" "$(grep -E "^${k}=" out/.config || echo '未启用/未设置')"
          done
        fi
        cp -f out/.config out/config.used 2>/dev/null || true
        cp -f arch/arm64/configs/${{ env.KERNEL_CONFIG }} out/defconfig.used 2>/dev/null || true

    - name: 开机基线硬断言（4.14）
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
        FAIL=0
        for k in CONFIG_ARCH_SM8150 CONFIG_MACH_XIAOMI_RAPHAEL CONFIG_BUILD_ARM64_DT_OVERLAY; do
          if grep -qE "^${k}=y$" out/.config; then echo "  [OK ] $k"; else echo "  [MISS] $k"; FAIL=$((FAIL+1)); fi
        done
        if [ "${{ env.ENABLE_KERNELSU }}" = "true" ]; then
          for k in CONFIG_MODULES CONFIG_KPROBES CONFIG_KSU; do
            if grep -qE "^${k}=y$" out/.config; then echo "  [OK ] $k"; else echo "  [MISS] $k"; FAIL=$((FAIL+1)); fi
          done
          grep -rq 'kernelsu' drivers/Makefile 2>/dev/null || { echo "  [MISS] drivers/Makefile 未接入 kernelsu"; FAIL=$((FAIL+1)); }
        fi
        echo "===== 观察项（不判定失败）====="
        for k in CONFIG_NAMESPACES CONFIG_PID_NS CONFIG_NET_NS CONFIG_CGROUPS CONFIG_OVERLAY_FS CONFIG_VETH CONFIG_BRIDGE CONFIG_NF_NAT CONFIG_IP_NF_IPTABLES CONFIG_SYSVIPC CONFIG_DEVTMPFS CONFIG_TMPFS CONFIG_SECCOMP CONFIG_KEYS; do
          printf "  %-32s %s\n" "$k" "$(grep -E "^${k}=" out/.config || echo '未启用')"
        done
        if [ "$FAIL" -ne 0 ]; then echo "### 开机基线自检失败：$FAIL 项异常，禁止出包"; exit 1; fi
        echo "### 开机基线自检通过"

    - name: 构建 dtb 与 dtbo.img（4.14：sm8150-v2 为 base）
      run: |
        set -e
        cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
        export PATH=$GITHUB_WORKSPACE/kernel_workspace/clang-aosp/clang-r450784d/bin:$PATH
        if [ "${LLVM_CONFIG}" = "y" ]; then
          make -j$(nproc --all) O=out ARCH=arm64 CC="ccache clang" CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- LLVM=1 LLVM_IAS=1 dtbs || true
        else
          make -j$(nproc --all) O=out ARCH=arm64 CC="ccache clang" CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- dtbs || true
        fi
        Q=out/arch/arm64/boot/dts/qcom
        echo "----- dtb/dtbo 产物 -----"
        ls -l $Q/sm8150-v2.dtb $Q/raphael-sm8150-overlay.dtbo $Q/dtbo.img 2>/dev/null || true
        [ -f $Q/sm8150-v2.dtb ] || { echo "### 缺少 sm8150-v2.dtb（boot 内 dtb 段来源），构建失败"; exit 1; }
        [ -f $Q/raphael-sm8150-overlay.dtbo ] || { echo "### 缺少 raphael-sm8150-overlay.dtbo，构建失败"; exit 1; }
        if [ ! -f $Q/dtbo.img ]; then
          echo ">>> 内核未自动生成 dtbo.img，手工生成（仅含 overlay）"
          python3 scripts/mkdtboimg.py create $Q/dtbo.img --page_size=4096 $Q/raphael-sm8150-overlay.dtbo
        fi
        ls -l $Q/dtbo.img

    - name: 打包 AnyKernel3（锁定 sm8150-v2 appended dtb + dtbo 同源）

      run: |

        cd $GITHUB_WORKSPACE/kernel_workspace

        git clone https://github.com/osm0sis/AnyKernel3

        sed -i 's/do.devicecheck=1/do.devicecheck=0/g' AnyKernel3/anykernel.sh

        sed -i 's!BLOCK=/dev/block/platform/omap/omap_hsmmc.0/by-name/boot;!BLOCK=/dev/block/bootdevice/by-name/boot;!g' AnyKernel3/anykernel.sh

        sed -i 's/is_slot_device=1;/is_slot_device=0;/g' AnyKernel3/anykernel.sh

        Q=android-kernel/out/arch/arm64/boot/dts/qcom
        KIMG=${KERNEL_IMAGE_NAME:-Image.gz-dtb}
        BASE=$Q/sm8150-v2.dtb
        [ -f "$BASE" ] || { echo "### 缺少 sm8150-v2.dtb，禁止出包"; exit 1; }
        # 优先取未附加 dtb 的 Image.gz，消除"内核自动 append 了别的 dtb"的不确定性
        if [ -f android-kernel/out/arch/arm64/boot/Image.gz ]; then
          SRC=android-kernel/out/arch/arm64/boot/Image.gz
        else
          SRC=android-kernel/out/arch/arm64/boot/$KIMG
        fi
        cp "$SRC" AnyKernel3/$KIMG
        DTBSZ=$(stat -c%s "$BASE")
        if [ "$(tail -c $DTBSZ AnyKernel3/$KIMG | sha256sum | cut -d' ' -f1)" != "$(sha256sum $BASE | cut -d' ' -f1)" ]; then
          echo ">>> 内核镜像尾部 dtb 与 sm8150-v2.dtb 不一致，执行拼装对齐"
          cat AnyKernel3/$KIMG "$BASE" > AnyKernel3/.kimg.tmp
          mv -f AnyKernel3/.kimg.tmp AnyKernel3/$KIMG
        fi
        rm -f AnyKernel3/dtb
        if [ "${NEED_DTBO:-false}" = "true" ]; then
          [ -s $Q/dtbo.img ] || { echo "### dtbo.img 缺失，禁止出包"; exit 1; }
          cp $Q/dtbo.img AnyKernel3/dtbo.img
        fi
        A=$(tail -c $DTBSZ AnyKernel3/$KIMG | sha256sum | cut -d' ' -f1)
        B=$(sha256sum $BASE | cut -d' ' -f1)
        [ "$A" = "$B" ] || { echo "### 内核段尾部 dtb 与自编译 dtb 不一致，禁止出包"; exit 1; }
        echo "===== 卡刷包内容 ====="
        ls -l AnyKernel3/
        echo "===== 校验（内核镜像尾部 dtb + dtbo 同源）====="
        sha256sum AnyKernel3/$KIMG $BASE $Q/dtbo.img 2>/dev/null | tee AnyKernel3/SHA256SUMS.txt || true
        echo "### 内核段尾部 dtb 一致性校验通过（$DTBSZ B, $A）"

        rm -rf AnyKernel3/.git* AnyKernel3/README.md

        rm -rf AnyKernel3/ramdisk AnyKernel3/modules AnyKernel3/patch

    

    

    - name: 打包并上传

      uses: actions/upload-artifact@v4

      with:

        name: ${{ env.KERNEL_ZIP_NAME }}

        path: kernel_workspace/AnyKernel3/*

    - name: 上传配置与校验信息
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.KERNEL_ZIP_NAME }}-config
        path: |
          kernel_workspace/android-kernel/out/config.used
          kernel_workspace/android-kernel/out/defconfig.used
        if-no-files-found: warn
