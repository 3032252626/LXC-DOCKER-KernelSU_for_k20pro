name: LXC-Docker + DroidSpaces + KSU v0.9.5 (Zundamon oss-base + clang22)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      KERNEL_DIR: kernel
      CCACHE_DIR: /home/runner/.ccache
      KBUILD_BUILD_USER: HyperPower
      KBUILD_BUILD_HOST: github-actions

    steps:
      - name: Checkout our repo (scripts + config)
        uses: actions/checkout@v4

      - name: Free up disk
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/graalvm /usr/local/share/powershell /usr/share/swift \
            /usr/local/lib/node_modules /opt/hostedtoolcache/CodeQL \
            /usr/local/share/chromium /usr/local/share/boost 2>/dev/null || true
          sudo apt-get clean

      - name: Install deps + 7z
        run: |
          sudo apt-get update >/dev/null 2>&1 || true
          sudo apt-get install -y -o Acquire::Retries=3 bc flex bison libssl-dev libelf-dev \
            p7zip-full ccache lz4 zip unzip python3 cpio wget git libyaml-dev >/dev/null 2>&1
          echo "deps ok"

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: /home/runner/.ccache
          key: ccache-zundamon-lxc-ksu-${{ github.run_id }}
          restore-keys: ccache-zundamon-lxc-ksu-

      - name: Download Mandi-Sa clang 22
        timeout-minutes: 10
        run: |
          cd /tmp
          curl -sSL --retry 3 -o tc.7z "https://github.com/Mandi-Sa/clang/releases/download/amd64-kernel-arm_static-22/llvm22.0.0-binutils2.45.1_amd64-kernel-arm_static-20260111.7z"
          7z x -y tc.7z -o/tmp/tc >/dev/null
          /tmp/tc/bin/clang --version | head -1

      - name: Clone kernel source (oss-base)
        run: |
          git clone --depth=1 -b oss-base \
            https://github.com/HeliumStudio-Dev/kernel_xiaomi_raphael.git kernel
          cd kernel
          echo "--- kernel version ---"
          grep -E "^(VERSION|PATCHLEVEL|SUBLEVEL)" Makefile

      - name: Enable swap
        run: |
          sudo swapoff -a 2>/dev/null || true
          sudo rm -f /mnt/swapfile
          if sudo fallocate -l 8G /mnt/swapfile; then
            sudo chmod 600 /mnt/swapfile
            sudo mkswap /mnt/swapfile
            sudo swapon /mnt/swapfile || true
          fi

      - name: Apply LXC/Docker + DroidSpaces patches
        working-directory: kernel
        run: |
          set -e

          # yaml fix (from zundamon workflow)
          sed -i -e 's/^ifeq (.*yaml-0.1.*$/ifeq (1,1)/' scripts/dtc/Makefile
          echo "=== yaml fix done ==="

          # === LXC/Docker config ===
          echo "=== LXC/Docker config ==="
          wget -q https://raw.githubusercontent.com/3032252626/android-lxc-docker/main/LXC-DOCKER-OPEN-CONFIG.sh -O /tmp/lxc-config.sh
          chmod 755 /tmp/lxc-config.sh
          sed -i '/^CONFIG_PID_NS=/d' arch/arm64/configs/raphael_defconfig
          echo "CONFIG_PID_NS=y" >> arch/arm64/configs/raphael_defconfig
          /tmp/lxc-config.sh arch/arm64/configs/raphael_defconfig -w
          echo "=== LXC/Docker config done ==="

          # === DroidSpaces Non-GKI config ===
          echo "=== DroidSpaces config ==="
          check_add() {
            local key="$1" val="$2"
            sed -i "/^${key}=/d" arch/arm64/configs/raphael_defconfig
            echo "${key}=${val}" >> arch/arm64/configs/raphael_defconfig
          }
          check_add CONFIG_NAMESPACES y
          check_add CONFIG_PID_NS y
          check_add CONFIG_UTS_NS y
          check_add CONFIG_IPC_NS y
          check_add CONFIG_USER_NS y
          check_add CONFIG_CGROUPS y
          check_add CONFIG_CGROUP_DEVICE y
          check_add CONFIG_CGROUP_PIDS y
          check_add CONFIG_CGROUP_FREEZER y
          check_add CONFIG_CGROUP_NET_PRIO y
          check_add CONFIG_OVERLAY_FS y
          check_add CONFIG_VETH y
          check_add CONFIG_BRIDGE y
          check_add CONFIG_NETFILTER y
          check_add CONFIG_NETFILTER_XT_MATCH_CGROUP y
          check_add CONFIG_IP_NF_TARGET_MASQUERADE y
          check_add CONFIG_POSIX_MQUEUE y
          echo "=== DroidSpaces config done ==="

          # === DroidSpaces patches ===
          echo "=== DroidSpaces patches ==="
          if [ -f net/netfilter/xt_qtaguid.c ]; then
            curl -sL "https://raw.githubusercontent.com/ravindu644/Droidspaces-OSS/main/Documentation/resources/kernel-patches/non-GKI/01.fix_kernel_panic_in_xt_qtaguid.patch" | patch -p1 || echo "[WARN] patch 01 failed"
          else
            echo "[SKIP] no xt_qtaguid.c"
          fi
          if ! grep -q "kernfs_create_link(cgrp->kn, name, kn)" kernel/cgroup/cgroup.c; then
            curl -sL "https://raw.githubusercontent.com/ravindu644/Droidspaces-OSS/main/Documentation/resources/kernel-patches/non-GKI/02.fix_restore%20cgroup%20file%20prefix%20handling%20.patch" | patch -p1 || echo "[WARN] patch 02 failed"
          else
            echo "[SKIP] cgroup prefix already built-in"
          fi
          echo "=== DroidSpaces patches done ==="

      - name: Inject KernelSU v0.9.5
        working-directory: kernel
        run: |
          set -e
          echo "=== Inject KernelSU v0.9.5 ==="
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s v0.9.5

          # KPROBES config
          echo "=== KPROBES config ==="
          echo "CONFIG_MODULES=y" >> arch/arm64/configs/raphael_defconfig
          echo "CONFIG_KPROBES=y" >> arch/arm64/configs/raphael_defconfig
          echo "CONFIG_HAVE_KPROBES=y" >> arch/arm64/configs/raphael_defconfig
          echo "CONFIG_KPROBE_EVENTS=y" >> arch/arm64/configs/raphael_defconfig

          # path_umount
          if ! grep -q 'int path_umount' fs/namespace.c; then
            cat >> fs/namespace.c << 'PATHUMOUNTEOF'
static int can_umount(const struct path *path, int flags)
{
	struct mount *mnt = real_mount(path->mnt);
	if (flags & ~(MNT_FORCE | MNT_DETACH | MNT_EXPIRE | UMOUNT_NOFOLLOW))
		return -EINVAL;
	if (!may_mount())
		return -EPERM;
	if (path->dentry != path->mnt->mnt_root)
		return -EINVAL;
	if (!check_mnt(mnt))
		return -EINVAL;
	if (mnt->mnt.mnt_flags & MNT_LOCKED)
		return -EINVAL;
	if (flags & MNT_FORCE && !capable(CAP_SYS_ADMIN))
		return -EPERM;
	return 0;
}

int path_umount(struct path *path, int flags)
{
	struct mount *mnt = real_mount(path->mnt);
	int ret;

	ret = can_umount(path, flags);
	if (!ret)
		ret = do_umount(mnt, path, flags);
	return ret;
}
PATHUMOUNTEOF
            echo "=== path_umount added ==="
          fi
          echo "=== KSU done ==="

      - name: Build kernel
        working-directory: kernel
        run: |
          set -e
          export PATH=/tmp/tc/bin:/tmp/tc/aarch64-linux-gnu/bin:/tmp/tc/arm-linux-gnueabi/bin:$PATH
          export ARCH=arm64

          MAKEVARS="CC=/tmp/tc/bin/clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- HOSTCC=gcc"

          echo "=== defconfig ==="
          make O=out ARCH=arm64 $MAKEVARS raphael_defconfig 2>&1 | tail -5

          echo "=== olddefconfig ==="
          make O=out ARCH=arm64 $MAKEVARS olddefconfig 2>&1 | tail -5

          echo "=== verify key configs ==="
          for opt in NAMESPACES PID_NS USER_NS CGROUP_PIDS CGROUP_DEVICE OVERLAY_FS VETH BRIDGE KPROBES MODULES; do
            grep "CONFIG_${opt}=" out/.config | sed 's/^/  /' || echo "  CONFIG_${opt} NOT SET"
          done

          echo "=== build Image.gz-dtb ==="
          ccache -M 15G >/dev/null 2>&1 || true
          make O=out ARCH=arm64 $MAKEVARS -j$(nproc) Image.gz-dtb KCFLAGS="-Wno-error"
          ls -lh out/arch/arm64/boot/Image.gz-dtb
          gzip -dc out/arch/arm64/boot/Image.gz-dtb | strings | grep -m1 "Linux version"

      - name: Package AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git ak3
          rm -rf ak3/.git
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' ak3/anykernel.sh
          sed -i 's!BLOCK=/dev/block/platform/omap/omap_hsmmc.0/by-name/boot;!BLOCK=/dev/block/bootdevice/by-name/boot;!g' ak3/anykernel.sh
          sed -i 's/is_slot_device=1;/is_slot_device=0;/g' ak3/anykernel.sh
          cp kernel/out/arch/arm64/boot/Image.gz-dtb ak3/Image.gz-dtb
          NAME="raphael-LXC-Docker-KSU-$(date +%Y%m%d).zip"
          ( cd ak3 && zip -r9 "../$NAME" . -x '.git*' 'README.md' >/dev/null )
          echo "ZIP_NAME=$NAME" >> $GITHUB_ENV
          ls -lh "$NAME"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: raphael-LXC-Docker-KSU
          path: ${{ env.ZIP_NAME }}
