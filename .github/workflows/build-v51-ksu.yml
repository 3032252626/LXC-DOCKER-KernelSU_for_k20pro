name: v5.1 verified clang22 recipe + KernelSU (tiann v0.9.5)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout kernel source (oss-base)
        uses: actions/checkout@v4
        with:
          repository: 3032252626/kernel_xiaomi_raphael
          ref: oss-base
          path: kernel

      - name: Install build deps + p7zip
        run: |
          sudo apt-get update
          sudo apt-get install -y -o Acquire::Retries=3 bc flex bison libssl-dev libelf-dev libyaml-dev pkg-config p7zip-full
          echo "deps ok"

      - name: Download Mandi-Sa clang 22
        timeout-minutes: 10
        run: |
          cd /tmp
          curl -sSL --retry 3 -o tc.7z "https://github.com/Mandi-Sa/clang/releases/download/amd64-kernel-arm_static-22/llvm22.0.0-binutils2.45.1_amd64-kernel-arm_static-20260111.7z"
          7z x -y tc.7z -o/tmp/tc >/dev/null
          rm -f /tmp/tc/bin/ld /tmp/tc/bin/ld.bfd /tmp/tc/bin/ld.lld /tmp/tc/bin/ld64.lld
          /tmp/tc/bin/clang --version | head -1

      - name: Setup KernelSU v0.9.5 (tiann, non-GKI kprobe)
        working-directory: kernel
        run: |
          set -e
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s v0.9.5
          echo "=== KernelSU injected files ==="
          ls -d drivers/kernelsu 2>/dev/null || ls -d KernelSU 2>/dev/null || true
          grep -n "kernelsu" drivers/Makefile || true
          grep -n "kernelsu" drivers/Kconfig || true
          test -d drivers/kernelsu -o -d KernelSU

      - name: Apply LXC/Docker + DroidSpaces + KSU config
        working-directory: kernel
        run: |
          set -e
          CFG=arch/arm64/configs/raphael_defconfig
          echo "=== yaml fix ==="
          sed -i -e 's/^ifeq (.*yaml-0.1.*$/ifeq (1,1)/' scripts/dtc/Makefile

          echo "=== fix hugetlbpage.c ptep undeclared ==="
          sed -i 's/ptep = huge_pmd_share/pte = huge_pmd_share/' arch/arm64/mm/hugetlbpage.c
          grep -n "huge_pmd_share" arch/arm64/mm/hugetlbpage.c

          echo "=== LXC/Docker config ==="
          wget -q https://raw.githubusercontent.com/3032252626/android-lxc-docker/main/LXC-DOCKER-OPEN-CONFIG.sh -O /tmp/lxc-config.sh
          chmod 755 /tmp/lxc-config.sh
          sed -i '/^CONFIG_PID_NS=/d' $CFG
          echo "CONFIG_PID_NS=y" >> $CFG
          /tmp/lxc-config.sh $CFG -w

          echo "=== DroidSpaces + KernelSU config ==="
          check_add() {
            local key="$1" val="$2"
            sed -i "/^${key}=/d" $CFG
            echo "${key}=${val}" >> $CFG
          }
          sed -i '/^CONFIG_BTRFS_FS=/d' $CFG
          echo "# CONFIG_BTRFS_FS is not set" >> $CFG
          sed -i '/^CONFIG_HUGETLB_PAGE=/d' $CFG
          echo "# CONFIG_HUGETLB_PAGE is not set" >> $CFG
          check_add CONFIG_MODULES y
          check_add CONFIG_MODVERSIONS y
          check_add CONFIG_MODULE_UNLOAD y
          check_add CONFIG_NAMESPACES y
          check_add CONFIG_PID_NS y
          check_add CONFIG_UTS_NS y
          check_add CONFIG_IPC_NS y
          check_add CONFIG_USER_NS y
          check_add CONFIG_CGROUPS y
          check_add CONFIG_CGROUP_DEVICE y
          check_add CONFIG_CGROUP_PIDS y
          check_add CONFIG_CGROUP_FREEZER y
          check_add CONFIG_CGROUP_NET_PRIO y
          check_add CONFIG_OVERLAY_FS y
          check_add CONFIG_VETH y
          check_add CONFIG_BRIDGE y
          check_add CONFIG_NETFILTER y
          check_add CONFIG_NETFILTER_XT_MATCH_CGROUP y
          check_add CONFIG_IP_NF_TARGET_MASQUERADE y
          check_add CONFIG_POSIX_MQUEUE y
          check_add CONFIG_KPROBES y
          check_add CONFIG_HAVE_KPROBES y
          check_add CONFIG_KPROBE_EVENTS y
          check_add CONFIG_KSU y
          grep -E "^CONFIG_(KSU|KPROBES|KPROBE_EVENTS|MODVERSIONS|MODULE_UNLOAD)=" $CFG

          echo "=== path_umount for KernelSU ==="
          if ! grep -q 'int path_umount' fs/namespace.c; then
            cat >> fs/namespace.c << 'PATHUMOUNTEOF'

          static int can_umount(const struct path *path, int flags)
          {
          	struct mount *mnt = real_mount(path->mnt);
          	if (flags & ~(MNT_FORCE | MNT_DETACH | MNT_EXPIRE | UMOUNT_NOFOLLOW))
          		return -EINVAL;
          	if (!may_mount())
          		return -EPERM;
          	if (path->dentry != path->mnt->mnt_root)
          		return -EINVAL;
          	if (!check_mnt(mnt))
          		return -EINVAL;
          	if (mnt->mnt.mnt_flags & MNT_LOCKED)
          		return -EINVAL;
          	if (flags & MNT_FORCE && !capable(CAP_SYS_ADMIN))
          		return -EPERM;
          	return 0;
          }

          int path_umount(struct path *path, int flags)
          {
          	struct mount *mnt = real_mount(path->mnt);
          	int ret;
          	ret = can_umount(path, flags);
          	if (!ret)
          		ret = do_umount(mnt, flags);
          	dput(path->dentry);
          	mntput_no_expire(mnt);
          	return ret;
          }
          PATHUMOUNTEOF
            echo "[ADD] path_umount appended"
          else
            echo "[SKIP] path_umount already present"
          fi

          echo "=== DroidSpaces patches ==="
          if [ -f net/netfilter/xt_qtaguid.c ]; then
            curl -sL "https://raw.githubusercontent.com/ravindu644/Droidspaces-OSS/main/Documentation/resources/kernel-patches/non-GKI/01.fix_kernel_panic_in_xt_qtaguid.patch" | patch -p1 || echo "[WARN] patch 01 failed"
          fi
          if ! grep -q "kernfs_create_link(cgrp->kn, name, kn)" kernel/cgroup/cgroup.c; then
            curl -sL "https://raw.githubusercontent.com/ravindu644/Droidspaces-OSS/main/Documentation/resources/kernel-patches/non-GKI/02.fix_restore%20cgroup%20file%20prefix%20handling%20.patch" | patch -p1 || echo "[WARN] patch 02 failed"
          fi
          echo "=== patches done ==="

      - name: Build Image.gz-dtb
        run: |
          cd kernel
          export PATH=/tmp/tc/bin:$PATH
          export ARCH=arm64

          MAKEVARS="CC=/tmp/tc/bin/clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- HOSTCC=gcc"

          echo "=== version check ==="
          grep -E "^(VERSION|PATCHLEVEL|SUBLEVEL)" Makefile

          echo "=== defconfig ==="
          make O=out ARCH=arm64 $MAKEVARS raphael_defconfig 2>&1 | tail -5
          sed -i '/^# CONFIG_MODULES is not set/d' out/.config
          echo "CONFIG_MODULES=y" >> out/.config
          echo "CONFIG_MODVERSIONS=y" >> out/.config
          echo "CONFIG_MODULE_UNLOAD=y" >> out/.config
          make O=out ARCH=arm64 $MAKEVARS olddefconfig 2>&1 | tail -5
          grep -E "CONFIG_KSU|CONFIG_MODULES|CONFIG_MODVERSIONS|CONFIG_MODULE_UNLOAD|CONFIG_KPROBES" out/.config

          echo "=== build ==="
          if ! make O=out ARCH=arm64 $MAKEVARS -j$(nproc) Image.gz-dtb KCFLAGS="-Wno-error" > build.log 2>&1; then
            grep -n -E "error:|Error [0-9]+|undefined reference|fatal error|No such file" build.log | tail -40 || true
            tail -40 build.log
            exit 1
          fi
          tail -10 build.log
          gzip -dc out/arch/arm64/boot/Image.gz-dtb | strings | grep -m1 "Linux version"
          echo "=== vermagic / KSU check ==="
          strings out/vmlinux | grep -m1 -E "mod_unload|modversions" || true

      - name: Pack AnyKernel3
        run: |
          sudo apt-get install -y -qq zip || true
          cd kernel
          git clone --depth 1 https://github.com/osm0sis/AnyKernel3
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' AnyKernel3/anykernel.sh
          sed -i 's!BLOCK=/dev/block/platform/omap/omap_hsmmc.0/by-name/boot;!BLOCK=/dev/block/bootdevice/by-name/boot;!g' AnyKernel3/anykernel.sh
          sed -i 's/is_slot_device=1;/is_slot_device=0;/g' AnyKernel3/anykernel.sh
          cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          rm -rf AnyKernel3/.git* AnyKernel3/README.md AnyKernel3/ramdisk AnyKernel3/modules AnyKernel3/patch
          cd AnyKernel3
          zip -r9 ../../raphael_Zundamon-v5.1-ossbase-LXC-KernelSU-tiann.zip . -x '.*'
          cd ../..
          ls -lh raphael_Zundamon-v5.1-ossbase-LXC-KernelSU-tiann.zip

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: raphael_Zundamon-v5.1-ossbase-LXC-KernelSU-tiann
          path: raphael_Zundamon-v5.1-ossbase-LXC-KernelSU-tiann.zip
