name: test-los23-clang22

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          repository: 3032252626/kernel_xiaomi_raphael_zundamon
          ref: lineage23-clang22
          path: buildrepo

      - uses: actions/checkout@v4
        with:
          repository: LineageOS/android_kernel_xiaomi_sm8150
          ref: lineage-23.2
          path: kernel

      - name: Install deps
        run: |
          sudo apt-get update >/dev/null 2>&1 || true
          sudo apt-get install -y bc flex bison libssl-dev libelf-dev p7zip-full >/dev/null 2>&1

      - name: Download clang 22
        run: |
          cd /tmp
          curl -sSL --retry 3 -o tc.7z "https://github.com/Mandi-Sa/clang/releases/download/amd64-kernel-arm_static-22/llvm22.0.0-binutils2.45.1_amd64-kernel-arm_static-20260111.7z"
          7z x -y tc.7z -o/tmp/tc >/dev/null

      - name: Build
        run: |
          cd kernel
          export PATH=/tmp/tc/bin:/tmp/tc/aarch64-linux-gnu/bin:/tmp/tc/arm-linux-gnueabi/bin:$PATH
          export ARCH=arm64
          mkdir -p out
          cp "$GITHUB_WORKSPACE/buildrepo/kernel_config.txt" out/.config
          echo "CONFIG_MACH_XIAOMI_RAPHAEL=y" >> out/.config
          make O=out ARCH=arm64 CC=clang HOSTCC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- olddefconfig
          make O=out ARCH=arm64 CC=clang HOSTCC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- -j$(nproc) Image.gz KCFLAGS="-Wno-error"

      - uses: actions/upload-artifact@v4
        with:
          name: los23-clang22-imagegz
          path: kernel/out/arch/arm64/boot/Image.gz