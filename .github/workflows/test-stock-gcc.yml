name: test-stock-gcc

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          repository: qaz6750/android_kernel_xiaomi_sm8150
          ref: a14-xiaomi-4.14.y
          path: kernel

      - name: Install GCC
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get install -y gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Build stock Image.gz
        run: |
          cd kernel
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          make O=out ARCH=arm64 raphael_stock_defconfig
          make O=out ARCH=arm64 olddefconfig
          make O=out ARCH=arm64 -j$(nproc) Image.gz

      - uses: actions/upload-artifact@v4
        with:
          name: stock-imagegz
          path: kernel/out/arch/arm64/boot/Image.gz